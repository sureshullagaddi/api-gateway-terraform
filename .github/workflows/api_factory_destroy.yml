name: "🗑️ API Factory — Destroy API"

on:
  workflow_dispatch:
    inputs:
      api_name:
        description: "API name to destroy (exact name used when provisioned)"
        required: true
        type: string

      environment:
        description: "Environment the API was deployed to"
        required: true
        type: choice
        options:
          - dev
          - sit
          - stage
          - prod

      confirm:
        description: "Type the api_name exactly to confirm DESTRUCTION"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  confirm-destroy:
    name: "🔒 Safety Check"
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.api_name }}" ]; then
            echo "❌ Confirmation does not match api_name — aborting."
            exit 1
          fi
          echo "⚠️  Confirmed destruction of: ${{ github.event.inputs.api_name }}"

  destroy:
    name: "🗑️ Destroy [${{ github.event.inputs.api_name }}]"
    runs-on: ubuntu-latest
    needs: confirm-destroy
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: environments/api-factory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
          role-session-name: api-factory-destroy-${{ github.event.inputs.api_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Setup Node.js + install Lambda dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Lambda dependencies
        run: npm install --omit=dev
        working-directory: lambda/src

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=tf-state-397979615352" \
            -backend-config="key=api-factory/${{ github.event.inputs.api_name }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-north-1' }}" \
            -backend-config="dynamodb_table=terraform-lock" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="api_name=${{ github.event.inputs.api_name }}" \
            -var="api_type=http-public" \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL }}" \
            -auto-approve \
            -input=false

      - name: Summary
        if: always()
        run: |
          echo "## 🗑️ API Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Name | \`${{ github.event.inputs.api_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroyed by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

